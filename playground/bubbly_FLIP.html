	<script>

		var canvas = document.getElementById("myCanvas");
		var gl = canvas.getContext("webgl2");

		canvas.width = window.innerWidth - 20;

		canvas.height = window.innerHeight - 20;

		canvas.focus();

		var simHeight = 3.0;
		var cScale = canvas.height / simHeight;
		var simWidth = canvas.width / cScale;

		var U_FIELD = 0;
		var V_FIELD = 1;

		var FLUID_CELL = 0;
		var AIR_CELL = 1;
		var SOLID_CELL = 2;

		var cnt = 0;

		var audioProcessor = null;
		var audioEnabled = false;
		var audioAnalyser = null;
		var analyserCanvas = null;
		var analyserCtx = null;

		function toggleAudio() {
			audioEnabled = !audioEnabled;

			if (audioEnabled) {
				if (!window.audioCtx) {
					initAudio();
				}
				if (window.audioCtx && window.audioCtx.state === 'suspended') {
					window.audioCtx.resume();
				}
			} else {
				if (window.audioCtx) {
					window.audioCtx.suspend();
				}
			}
		}

		function isBubbleParticle(id) {
			return scene.fluid.particleType[id] == 2 || scene.fluid.particleType[id] == 3;
		}

		const workletCode = `
		class CustomAudioProcessor extends AudioWorkletProcessor {
			constructor() {
				super();
				this.scene = null;
				this.localBubbleStates = new Map();
				this.sampleRate = 44800;
				this.smoothingFactor = 0.95; // Add smoothing factor
				this.previousSample = 0;      // Keep track of previous sample
				
				this.port.onmessage = (event) => {
					if (event.data.type === 'updateScene') {
						const newScene = event.data.scene;
						if (newScene.fluid) {
							for (let j = newScene.fluid.numFluidParticles; j < newScene.fluid.numParticles; j++) {
								if (newScene.fluid.particleType[j] === 2 || newScene.fluid.particleType[j] === 3) {
									if (!this.localBubbleStates.has(j)) {
										this.localBubbleStates.set(j, {
											phase: 0,
											time: 0,
											radius: newScene.fluid.bubbleRadius[j],
											targetRadius: newScene.fluid.bubbleRadius[j],
											currentAmplitude: 0,
											targetAmplitude: 0.1
										});
									} else {
										const state = this.localBubbleStates.get(j);
										// Smoothly interpolate radius changes
										state.targetRadius = newScene.fluid.bubbleRadius[j];
									}
								} else {
									if (this.localBubbleStates.has(j)) {
										// Fade out bubble instead of immediate removal
										const state = this.localBubbleStates.get(j);
										state.targetAmplitude = 0;
									}
								}
							}
							this.scene = newScene;
						}
					}
				};
			}

			process(inputs, outputs, parameters) {
				const output = outputs[0];
				const dt = 1.0 / this.sampleRate;
				
				for (let channel = 0; channel < output.length; ++channel) {
					const outputChannel = output[channel];
					for (let i = 0; i < outputChannel.length; ++i) {
						let sample = 0.0;

						// Process each bubble
						for (const [id, bubbleState] of this.localBubbleStates.entries()) {
							// Smoothly interpolate radius
							bubbleState.radius += (bubbleState.targetRadius - bubbleState.radius) * 0.1;
							// bubbleState.radius = bubbleState.targetRadius;
							
							// Smoothly interpolate amplitude
							bubbleState.currentAmplitude += (bubbleState.targetAmplitude - bubbleState.currentAmplitude) * 0.1;
							// bubbleState.currentAmplitude = bubbleState.targetAmplitude;
							
							// TODO: There may be other laws for the frequency
							const freq = 3.0 / bubbleState.radius;
							
							bubbleState.time += dt;
							bubbleState.phase += freq * 2 * Math.PI * dt;
							
							// Apply smooth amplitude envelope
							const amplitude = bubbleState.currentAmplitude * Math.exp(-bubbleState.time * 3.0);
							
							// Add oscillator contribution
							sample += amplitude * Math.sin(bubbleState.phase);

							// Remove bubble if amplitude is very small
							if (amplitude < 0.0001) {
								this.localBubbleStates.delete(id);
							}
						}

						// Apply smoothing between samples
						sample = this.previousSample * this.smoothingFactor + 
								sample * (1 - this.smoothingFactor);
						this.previousSample = sample;

						// Soft clipping instead of hard clipping
						sample = Math.tanh(sample);
						
						outputChannel[i] = sample;
					}
				}
				return true;
			}
		}
		registerProcessor('custom-audio-processor', CustomAudioProcessor);
				`;

		const blob = new Blob([workletCode], { type: 'application/javascript' });
		const workletURL = URL.createObjectURL(blob);

		// Add this function for visualization
		function visualize() {
			const bufferLength = audioAnalyser.frequencyBinCount;
			const dataArray = new Float32Array(bufferLength);

			function draw() {
				requestAnimationFrame(draw);

				audioAnalyser.getFloatTimeDomainData(dataArray);

				analyserCtx.fillStyle = 'rgb(0, 0, 0)';
				analyserCtx.fillRect(0, 0, analyserCanvas.width, analyserCanvas.height);

				analyserCtx.lineWidth = 2;
				analyserCtx.strokeStyle = 'rgb(0, 255, 0)';
				analyserCtx.beginPath();

				const sliceWidth = analyserCanvas.width / bufferLength;
				let x = 0;

				for (let i = 0; i < bufferLength; i++) {
					const v = dataArray[i];
					const y = analyserCanvas.height / 2 + v * analyserCanvas.height / 2;

					if (i === 0) {
						analyserCtx.moveTo(x, y);
					} else {
						analyserCtx.lineTo(x, y);
					}

					x += sliceWidth;
				}

				analyserCtx.lineTo(analyserCanvas.width, analyserCanvas.height / 2);
				analyserCtx.stroke();
			}

			draw();
		}

		// Modify the initAudio function to include both scene updates and visualization
		async function initAudio() {
			try {
				window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
				await window.audioCtx.audioWorklet.addModule(workletURL);

				const workletNode = new AudioWorkletNode(window.audioCtx, 'custom-audio-processor');

				// Create and configure analyser
				audioAnalyser = window.audioCtx.createAnalyser();
				audioAnalyser.fftSize = 2048;

				// Connect audio nodes: worklet -> analyser -> destination
				workletNode.connect(audioAnalyser);
				audioAnalyser.connect(window.audioCtx.destination);

				// Setup analyser canvas with fixed dimensions
				analyserCanvas = document.getElementById('analyserCanvas');
				analyserCanvas.width = 300;
				analyserCanvas.height = 150;
				analyserCtx = analyserCanvas.getContext('2d');

				// Store node globally
				window.audioWorkletNode = workletNode;

				// Set up scene updates
				setInterval(() => {
					if (audioEnabled && window.audioWorkletNode) {
						const simplifiedScene = {
							fluid: {
								numFluidParticles: scene.fluid.numFluidParticles,
								numParticles: scene.fluid.numParticles,
								particleType: scene.fluid.particleType,
								bubbleRadius: scene.fluid.bubbleRadius,
								bubbleTime: scene.fluid.bubbleTime,
								bubblePhase: scene.fluid.bubblePhase
							}
						};

						window.audioWorkletNode.port.postMessage({
							type: 'updateScene',
							scene: simplifiedScene
						});
					}
				}, 16);

				// Start visualization
				visualize();

			} catch (error) {
				console.error('Error initializing audio context and worklet:', error);
			}
		}

		function clamp(x, min, max) {
			if (x < min)
				return min;
			else if (x > max)
				return max;
			else
				return x;
		}

		// ----------------- start of simulator ------------------------------

		class FlipFluid {
			constructor(density, width, height, spacing, particleRadius, maxParticles) {

				// fluid

				this.density = density;
				this.fNumX = Math.floor(width / spacing) + 1;
				this.fNumY = Math.floor(height / spacing) + 1;
				this.h = Math.max(width / this.fNumX, height / this.fNumY);
				this.fInvSpacing = 1.0 / this.h;
				this.fNumCells = this.fNumX * this.fNumY;

				this.u = new Float32Array(this.fNumCells);
				this.v = new Float32Array(this.fNumCells);
				this.du = new Float32Array(this.fNumCells);
				this.dv = new Float32Array(this.fNumCells);
				this.prevU = new Float32Array(this.fNumCells);
				this.prevV = new Float32Array(this.fNumCells);
				this.p = new Float32Array(this.fNumCells);
				this.s = new Float32Array(this.fNumCells);
				this.cellType = new Int32Array(this.fNumCells);
				this.cellColor = new Float32Array(3 * this.fNumCells);

				// particles

				this.maxParticles = maxParticles;

				this.particlePos = new Float32Array(2 * this.maxParticles);
				this.particleColor = new Float32Array(3 * this.maxParticles);
				for (var i = 0; i < this.maxParticles; i++)
					this.particleColor[3 * i + 2] = 1.0;

				this.particleVel = new Float32Array(2 * this.maxParticles);
				this.particleDensity = new Float32Array(this.fNumCells);
				this.particleRestDensity = 0.0;

				this.particleRadius = particleRadius;
				this.pInvSpacing = 1.0 / (2.2 * particleRadius);
				this.pNumX = Math.floor(width * this.pInvSpacing) + 1;
				this.pNumY = Math.floor(height * this.pInvSpacing) + 1;
				this.pNumCells = this.pNumX * this.pNumY;

				this.numCellParticles = new Int32Array(this.pNumCells);
				this.firstCellParticle = new Int32Array(this.pNumCells + 1);
				this.cellParticleIds = new Int32Array(maxParticles);

				this.numParticles = 0;
				this.numFluidParticles = 0;

				// bubble particles 

				this.numBubbleParticles = 0;
				// particle type: 0 for not activated (or deleted), 1 for fluid particles, 2 for bubble particles
				// add a new particle type for bubble particle: 3 for decaying bubble to simulate frequency shift
				this.particleType = new Int32Array(this.maxParticles);
				this.bubbleRadius = new Float32Array(this.maxParticles);
				this.bubbleRadius.fill(0.0);

				// audio part 
				this.bubblePhase = new Float32Array(this.maxParticles);
				this.bubbleAmplitude = new Float32Array(this.maxParticles);
				// record the time for how long this bubble has been activated
				this.bubbleTime = new Float32Array(this.maxParticles);

				this.acousticPressure = new Float32Array(this.fNumCells);
				
				// Constants for acoustic wave equation (for air at rest)
				this.rho0 = 1.204;  // air density in kg/m^3 
				this.c0 = 343.2;    // speed of sound in m/s
			}

			integrateParticles(dt, gravity) {
				for (var i = 0; i < this.numParticles; i++) {
					if (this.particleType[i] == 1) {
						this.particleVel[2 * i + 1] += dt * gravity;
					}
					else if (isBubbleParticle(i)) {
						var cellNr = this.getParticleNr(i);
						// acutally the coeff should be proportional to the bubble volume
						// but here we just use a constant value
						var coeff = 0.1 * Math.pow(this.bubbleRadius[i] / this.h, 2);
						if (AIR_CELL == this.cellType[cellNr]) {
							coeff = 0.0;
						}
						var buoyancy_force = - coeff * gravity;
						this.particleVel[2 * i + 1] += dt * buoyancy_force;
					}
					else if (this.particleType[i] > 3) {
						console.log("particle type error");
					}
					this.particlePos[2 * i] += this.particleVel[2 * i] * dt;
					this.particlePos[2 * i + 1] += this.particleVel[2 * i + 1] * dt;
				}
			}

			pushParticlesApart(numIters) {
				var colorDiffusionCoeff = 0.001;

				// count particles per cell

				this.numCellParticles.fill(0);

				for (var i = 0; i < this.numFluidParticles; i++) {
					var x = this.particlePos[2 * i];
					var y = this.particlePos[2 * i + 1];

					var xi = clamp(Math.floor(x * this.pInvSpacing), 0, this.pNumX - 1);
					var yi = clamp(Math.floor(y * this.pInvSpacing), 0, this.pNumY - 1);
					var cellNr = xi * this.pNumY + yi;
					this.numCellParticles[cellNr]++;
				}

				// partial sums

				var first = 0;

				for (var i = 0; i < this.pNumCells; i++) {
					first += this.numCellParticles[i];
					this.firstCellParticle[i] = first;
				}
				this.firstCellParticle[this.pNumCells] = first;		// guard

				// fill particles into cells

				for (var i = 0; i < this.numFluidParticles; i++) {
					var x = this.particlePos[2 * i];
					var y = this.particlePos[2 * i + 1];

					var xi = clamp(Math.floor(x * this.pInvSpacing), 0, this.pNumX - 1);
					var yi = clamp(Math.floor(y * this.pInvSpacing), 0, this.pNumY - 1);
					var cellNr = xi * this.pNumY + yi;
					this.firstCellParticle[cellNr]--;
					this.cellParticleIds[this.firstCellParticle[cellNr]] = i;
				}

				// push particles apart

				var minDist = 2.0 * this.particleRadius;
				var minDist2 = minDist * minDist;

				for (var iter = 0; iter < numIters; iter++) {

					for (var i = 0; i < this.numFluidParticles; i++) {
						var px = this.particlePos[2 * i];
						var py = this.particlePos[2 * i + 1];

						var pxi = Math.floor(px * this.pInvSpacing);
						var pyi = Math.floor(py * this.pInvSpacing);
						var x0 = Math.max(pxi - 1, 0);
						var y0 = Math.max(pyi - 1, 0);
						var x1 = Math.min(pxi + 1, this.pNumX - 1);
						var y1 = Math.min(pyi + 1, this.pNumY - 1);

						for (var xi = x0; xi <= x1; xi++) {
							for (var yi = y0; yi <= y1; yi++) {
								var cellNr = xi * this.pNumY + yi;
								var first = this.firstCellParticle[cellNr];
								var last = this.firstCellParticle[cellNr + 1];
								for (var j = first; j < last; j++) {
									var id = this.cellParticleIds[j];
									if (id == i)
										continue;
									var qx = this.particlePos[2 * id];
									var qy = this.particlePos[2 * id + 1];

									var dx = qx - px;
									var dy = qy - py;
									var d2 = dx * dx + dy * dy;
									if (d2 > minDist2 || d2 == 0.0)
										continue;
									var d = Math.sqrt(d2);
									var s = 0.5 * (minDist - d) / d;
									dx *= s;
									dy *= s;
									this.particlePos[2 * i] -= dx;
									this.particlePos[2 * i + 1] -= dy;
									this.particlePos[2 * id] += dx;
									this.particlePos[2 * id + 1] += dy;

									// diffuse colors

									for (var k = 0; k < 3; k++) {
										var color0 = this.particleColor[3 * i + k];
										var color1 = this.particleColor[3 * id + k];
										var color = (color0 + color1) * 0.5;
										this.particleColor[3 * i + k] = color0 + (color - color0) * colorDiffusionCoeff;
										this.particleColor[3 * id + k] = color1 + (color - color1) * colorDiffusionCoeff;
									}
								}
							}
						}
					}
				}
			}

			handleParticleCollisions(obstacleX, obstacleY, obstacleRadius) {
				var h = 1.0 / this.fInvSpacing;
				var r = this.particleRadius;
				var or = obstacleRadius;
				var or2 = or * or;
				var minDist = obstacleRadius + r;
				var minDist2 = minDist * minDist;

				var minX = h + r;
				var maxX = (this.fNumX - 1) * h - r;
				var minY = h + r;
				var maxY = (this.fNumY - 1) * h - r;


				for (var i = 0; i < this.numParticles; i++) {
					var x = this.particlePos[2 * i];
					var y = this.particlePos[2 * i + 1];

					var dx = x - obstacleX;
					var dy = y - obstacleY;
					var d2 = dx * dx + dy * dy;

					// obstacle collision

					if (d2 < minDist2) {

						// var d = Math.sqrt(d2);
						// var s = (minDist - d) / d;
						// x += dx * s;
						// y += dy * s;

						this.particleVel[2 * i] = scene.obstacleVelX;
						this.particleVel[2 * i + 1] = scene.obstacleVelY;
					}

					// wall collisions

					if (x < minX) {
						x = minX;
						this.particleVel[2 * i] = 0.0;

					}
					if (x > maxX) {
						x = maxX;
						this.particleVel[2 * i] = 0.0;
					}
					if (y < minY) {
						y = minY;
						this.particleVel[2 * i + 1] = 0.0;
					}
					if (y > maxY) {
						y = maxY;
						this.particleVel[2 * i + 1] = 0.0;
					}
					this.particlePos[2 * i] = x;
					this.particlePos[2 * i + 1] = y;
				}
			}

			updateParticleDensity() {
				var n = this.fNumY;
				var h = this.h;
				var h1 = this.fInvSpacing;
				var h2 = 0.5 * h;

				var d = f.particleDensity;

				d.fill(0.0);

				for (var i = 0; i < this.numFluidParticles; i++) {

					var x = this.particlePos[2 * i];
					var y = this.particlePos[2 * i + 1];

					x = clamp(x, h, (this.fNumX - 1) * h);
					y = clamp(y, h, (this.fNumY - 1) * h);

					var x0 = Math.floor((x - h2) * h1);
					var tx = ((x - h2) - x0 * h) * h1;
					var x1 = Math.min(x0 + 1, this.fNumX - 2);

					var y0 = Math.floor((y - h2) * h1);
					var ty = ((y - h2) - y0 * h) * h1;
					var y1 = Math.min(y0 + 1, this.fNumY - 2);

					var sx = 1.0 - tx;
					var sy = 1.0 - ty;

					if (x0 < this.fNumX && y0 < this.fNumY) d[x0 * n + y0] += sx * sy;
					if (x1 < this.fNumX && y0 < this.fNumY) d[x1 * n + y0] += tx * sy;
					if (x1 < this.fNumX && y1 < this.fNumY) d[x1 * n + y1] += tx * ty;
					if (x0 < this.fNumX && y1 < this.fNumY) d[x0 * n + y1] += sx * ty;
				}

				if (this.particleRestDensity == 0.0) {
					var sum = 0.0;
					var numFluidCells = 0;

					for (var i = 0; i < this.fNumCells; i++) {
						if (this.cellType[i] == FLUID_CELL) {
							sum += d[i];
							numFluidCells++;
						}
					}

					if (numFluidCells > 0)
						this.particleRestDensity = sum / numFluidCells;
				}

				// 			for (var xi = 1; xi < this.fNumX; xi++) {
				// 				for (var yi = 1; yi < this.fNumY; yi++) {
				// 					var cellNr = xi * n + yi;
				// 					if (this.cellType[cellNr] != FLUID_CELL)

				// 					if (this.cellType[(xi - 1) * n + yi] == SOLID_CELL || this.cellType[(xi + 1) * n + yi] == SOLID_CELL)
				// 						hx -= this.particleRadius;
				// 					if (this.cellType[xi * n + yi - 1] == SOLID_CELL || this.cellType[xi * n + yi + 1] == SOLID_CELL)
				// 						hy -= this.particleRadius;

				// 					var scale = this.h * this.h / (hx * hy)
				// 					d[cellNr] *= scale;
				// 				}
				// 			}
			}

			transferVelocities(toGrid, flipRatio) {
				var n = this.fNumY;
				var h = this.h;
				var h1 = this.fInvSpacing;
				var h2 = 0.5 * h;

				if (toGrid) {

					this.prevU.set(this.u);
					this.prevV.set(this.v);

					this.du.fill(0.0);
					this.dv.fill(0.0);
					this.u.fill(0.0);
					this.v.fill(0.0);

					for (var i = 0; i < this.fNumCells; i++)
						this.cellType[i] = this.s[i] == 0.0 ? SOLID_CELL : AIR_CELL;

					for (var i = 0; i < this.numFluidParticles; i++) {

						var x = this.particlePos[2 * i];
						var y = this.particlePos[2 * i + 1];
						var xi = clamp(Math.floor(x * h1), 0, this.fNumX - 1);
						var yi = clamp(Math.floor(y * h1), 0, this.fNumY - 1);
						var cellNr = xi * n + yi;
						if (this.cellType[cellNr] == AIR_CELL)
							this.cellType[cellNr] = FLUID_CELL;
					}
				}

				for (var component = 0; component < 2; component++) {

					var dx = component == 0 ? 0.0 : h2;
					var dy = component == 0 ? h2 : 0.0;

					var f = component == 0 ? this.u : this.v;
					var prevF = component == 0 ? this.prevU : this.prevV;
					var d = component == 0 ? this.du : this.dv;

					// for (var i = 0; i < this.numFluidParticles; i++) {
					for (var i = 0; i < this.numParticles; i++) {

						var x = this.particlePos[2 * i];
						var y = this.particlePos[2 * i + 1];

						x = clamp(x, h, (this.fNumX - 1) * h);
						y = clamp(y, h, (this.fNumY - 1) * h);

						var x0 = Math.min(Math.floor((x - dx) * h1), this.fNumX - 2);
						var tx = ((x - dx) - x0 * h) * h1;
						var x1 = Math.min(x0 + 1, this.fNumX - 2);

						var y0 = Math.min(Math.floor((y - dy) * h1), this.fNumY - 2);
						var ty = ((y - dy) - y0 * h) * h1;
						var y1 = Math.min(y0 + 1, this.fNumY - 2);

						var sx = 1.0 - tx;
						var sy = 1.0 - ty;

						var d0 = sx * sy;
						var d1 = tx * sy;
						var d2 = tx * ty;
						var d3 = sx * ty;

						var nr0 = x0 * n + y0;
						var nr1 = x1 * n + y0;
						var nr2 = x1 * n + y1;
						var nr3 = x0 * n + y1;

						if (toGrid) {
							var pv = this.particleVel[2 * i + component];
							f[nr0] += pv * d0; d[nr0] += d0;
							f[nr1] += pv * d1; d[nr1] += d1;
							f[nr2] += pv * d2; d[nr2] += d2;
							f[nr3] += pv * d3; d[nr3] += d3;
						}
						else {
							var offset = component == 0 ? n : 1;
							var valid0 = this.cellType[nr0] != AIR_CELL || this.cellType[nr0 - offset] != AIR_CELL ? 1.0 : 0.0;
							var valid1 = this.cellType[nr1] != AIR_CELL || this.cellType[nr1 - offset] != AIR_CELL ? 1.0 : 0.0;
							var valid2 = this.cellType[nr2] != AIR_CELL || this.cellType[nr2 - offset] != AIR_CELL ? 1.0 : 0.0;
							var valid3 = this.cellType[nr3] != AIR_CELL || this.cellType[nr3 - offset] != AIR_CELL ? 1.0 : 0.0;

							var v = this.particleVel[2 * i + component];
							var d = valid0 * d0 + valid1 * d1 + valid2 * d2 + valid3 * d3;

							if (d > 0.0) {

								var picV = (valid0 * d0 * f[nr0] + valid1 * d1 * f[nr1] + valid2 * d2 * f[nr2] + valid3 * d3 * f[nr3]) / d;
								var corr = (valid0 * d0 * (f[nr0] - prevF[nr0]) + valid1 * d1 * (f[nr1] - prevF[nr1])
									+ valid2 * d2 * (f[nr2] - prevF[nr2]) + valid3 * d3 * (f[nr3] - prevF[nr3])) / d;
								var flipV = v + corr;

								this.particleVel[2 * i + component] = (1.0 - flipRatio) * picV + flipRatio * flipV;
							}
						}
					}

					if (toGrid) {
						for (var i = 0; i < f.length; i++) {
							if (d[i] > 0.0)
								f[i] /= d[i];
						}

						// restore solid cells

						for (var i = 0; i < this.fNumX; i++) {
							for (var j = 0; j < this.fNumY; j++) {
								var solid = this.cellType[i * n + j] == SOLID_CELL;
								if (solid || (i > 0 && this.cellType[(i - 1) * n + j] == SOLID_CELL))
									this.u[i * n + j] = this.prevU[i * n + j];
								if (solid || (j > 0 && this.cellType[i * n + j - 1] == SOLID_CELL))
									this.v[i * n + j] = this.prevV[i * n + j];
							}
						}
					}
				}
			}

			solveIncompressibility(numIters, dt, overRelaxation, compensateDrift = true) {

				this.p.fill(0.0);
				this.prevU.set(this.u);
				this.prevV.set(this.v);

				var n = this.fNumY;
				var cp = this.density * this.h / dt;

				for (var i = 0; i < this.fNumCells; i++) {
					var u = this.u[i];
					var v = this.v[i];
				}

				for (var iter = 0; iter < numIters; iter++) {

					for (var i = 1; i < this.fNumX - 1; i++) {
						for (var j = 1; j < this.fNumY - 1; j++) {

							if (this.cellType[i * n + j] != FLUID_CELL)
								continue;

							var center = i * n + j;
							var left = (i - 1) * n + j;
							var right = (i + 1) * n + j;
							var bottom = i * n + j - 1;
							var top = i * n + j + 1;

							var s = this.s[center];
							var sx0 = this.s[left];
							var sx1 = this.s[right];
							var sy0 = this.s[bottom];
							var sy1 = this.s[top];
							var s = sx0 + sx1 + sy0 + sy1;
							if (s == 0.0)
								continue;

							var div = this.u[right] - this.u[center] +
								this.v[top] - this.v[center];

							if (this.particleRestDensity > 0.0 && compensateDrift) {
								var k = 1.0;
								var compression = this.particleDensity[i * n + j] - this.particleRestDensity;
								if (compression > 0.0)
									div = div - k * compression;
							}

							var p = -div / s;
							p *= overRelaxation;
							this.p[center] += cp * p;

							this.u[center] -= sx0 * p;
							this.u[right] += sx1 * p;
							this.v[center] -= sy0 * p;
							this.v[top] += sy1 * p;
						}
					}
				}
			}
			// Dynamically add bubble particles based on the density of the fluid
			addBubbleParticles() {
				if (this.numParticles >= this.maxParticles) {
					console.log("maxParticles reached");
					return;
				}

				var topNarrowBand = this.searchTopNarrowBand();
				for (var i = 0; i < this.numFluidParticles; i++) {

					var h1 = this.fInvSpacing;
					var x = this.particlePos[2 * i];
					var y = this.particlePos[2 * i + 1];
					var xi = clamp(Math.floor(x * h1), 1, this.fNumX - 1);
					var yi = clamp(Math.floor(y * h1), 1, this.fNumY - 1);
					var cellNr = xi * this.fNumY + yi;

					var cellAbove = xi * this.fNumY + yi + 1;
					var cellBelow = xi * this.fNumY + yi - 1;
					var cellLeft = (xi - 1) * this.fNumY + yi;
					var cellRight = (xi + 1) * this.fNumY + yi;

					var isAroundAir = this.cellType[cellAbove] == AIR_CELL || this.cellType[cellBelow] == AIR_CELL || this.cellType[cellLeft] == AIR_CELL || this.cellType[cellRight] == AIR_CELL;
					var isAroundBoundary = this.cellType[cellAbove] == SOLID_CELL || this.cellType[cellBelow] == SOLID_CELL || this.cellType[cellLeft] == SOLID_CELL || this.cellType[cellRight] == SOLID_CELL;

					var isAroundTopNarrowBand = topNarrowBand[cellAbove] || topNarrowBand[cellBelow] || topNarrowBand[cellLeft] || topNarrowBand[cellRight];

					var d0 = this.particleRestDensity;

					if (d0 > 0.0) {
						var relDensity = this.particleDensity[cellNr] / d0;
						// below the surface
						if (relDensity < 0.3 && !isAroundAir && !isAroundBoundary) {
							// if (relDensity < 0.3 && isAroundTopNarrowBand && !isAroundBoundary && !isAroundAir) {
							// add a new particle
							// scan for the first empty slot
							var prob = Math.random();
							if (prob < 0.5) { continue; }

							// based on relDensity, set the radius
							var radius = (0.5 * (1 - relDensity) + 0.5 * Math.random()) * this.h;
							this.addSingleBubbleAtPosition(x, y, radius);
						}
					}
				}
			}

			deleteSingleBubbleParticles(id, decay = true) {
				if (decay) {
					// not directly set its type to 0, but set it to 3, which is the decaying bubble particle
					this.particleType[id] = 3;
					// console.log("delete bubble particle with decay");
					// do not decrease numBubbleParticles here! 
				}
				else { // really delete the bubble particle
					this.numParticles--; // only decrease counts when really deleting
					this.numBubbleParticles--;

					this.particleType[id] = 0;
					// set the color to black
					this.particleColor[3 * id] = 0.0;
					this.particleColor[3 * id + 1] = 0.0;
					this.particleColor[3 * id + 2] = 0.0;

					this.particlePos[2 * id] = 0.0;
					this.particlePos[2 * id + 1] = 0.0;

					this.bubbleAmplitude[id] = 0.0;
					this.bubbleTime[id] = 0.0;
				}
			}

			decayBubbleParticles() {
				for (var i = this.numFluidParticles; i < this.numParticles; i++) {
					if (this.particleType[i] == 3) {
						// console.log("decay bubble particle");
						// exponentially decay the bubble radius
						// this.bubbleRadius[i] *= 0.99; // just for testing 
						this.bubbleRadius[i] *= 0.85;
						// console.log("bubble radius: ", this.bubbleRadius[i]);
						// if the bubble radius is less than 0.01h, really delete the bubble particle
						if (this.bubbleRadius[i] < 0.2 * this.h) {
							this.deleteSingleBubbleParticles(i, false);
						}
					}
				}
			}

			searchTopNarrowBand() {
				var topNarrowBand = new Int32Array(this.fNumCells);
				topNarrowBand.fill(0);

				for (var i = 0; i < this.fNumX; i++) {
					for (var j = this.fNumY - 1; j >= 0; j--) {
						var cellNr = i * this.fNumY + j;
						var cellBelow = i * this.fNumY + j - 1;
						if (this.cellType[cellNr] == AIR_CELL && this.cellType[cellBelow] == FLUID_CELL) {
							var NarrowBandWidth = 12;
							for (var k = 0; k < NarrowBandWidth; k++) {
								if (this.cellType[cellNr - k] == FLUID_CELL) {
									topNarrowBand[cellNr - k] = 1;
								}
							}
							break;
						}
					}
				}

				return topNarrowBand;
			}

			getParticleNr(id) {
				var x = this.particlePos[2 * id];
				var y = this.particlePos[2 * id + 1];
				var h1 = this.fInvSpacing;
				var xi = clamp(Math.floor(x * h1), 1, this.fNumX - 1);
				var yi = clamp(Math.floor(y * h1), 1, this.fNumY - 1);
				return xi * this.fNumY + yi;
			}

			deleteBubbleParticles() {
				// First need to identify the top narrow band of air cells 
				// Then delete the bubble particles that are in this air cells

				var topNarrowBand = this.searchTopNarrowBand();

				var h1 = this.fInvSpacing;
				// if bubble particles enter the air cell, delete them
				for (var i = this.numFluidParticles; i < this.numParticles; i++) {
					if (this.particleType[i] != 2) // do not consider decaying bubble particles
						continue;

					// check if bubble particles enter the air cell
					var cellNr = this.getParticleNr(i);
					if (topNarrowBand[cellNr]) {
						// var prob = Math.random();
						// if (prob < 0.5) { continue; }
						this.deleteSingleBubbleParticles(i, true);
						// this.deleteSingleBubbleParticles(i, false);
					}
					else if (this.cellType[cellNr] == AIR_CELL) {
						// var prob = Math.random();
						// with smaller radius, the probability of being deleted is higher
						// if (prob < 0.5) { continue; }
						this.deleteSingleBubbleParticles(i, true);
						// this.deleteSingleBubbleParticles(i, false);
					}
				}
			}

			mergeBubbleParticles() {
				var h1 = this.fInvSpacing;

				var cellBubbleParticleIds = new Int32Array(this.fNumCells);
				var cellBubbleRadius = new Float32Array(this.fNumCells);
				var cellBubbleParticleCount = new Int32Array(this.fNumCells);

				cellBubbleParticleIds.fill(0);
				cellBubbleRadius.fill(0.0);
				cellBubbleParticleCount.fill(0);

				for (var i = this.numFluidParticles; i < this.numParticles; i++) {
					if (!isBubbleParticle(i))
						continue;
					var cellNr = this.getParticleNr(i);

					if (cellBubbleParticleCount[cellNr] == 0) {
						cellBubbleParticleIds[cellNr] = i;
						cellBubbleRadius[cellNr] = this.bubbleRadius[i] * this.bubbleRadius[i];
						cellBubbleParticleCount[cellNr] = 1;
					}
					else { // already has a bubble particle
						cellBubbleRadius[cellNr] += this.bubbleRadius[i] * this.bubbleRadius[i];
						cellBubbleParticleCount[cellNr] += 1;
						// console.log("merge bubble particles");
						// console.log("Bubble particle count: ", cellBubbleParticleCount[cellNr]);
						// console.log("Bubble particle radius: ", cellBubbleRadius[cellNr]);
						this.deleteSingleBubbleParticles(i, false);
					}
				}

				// traverse cells:
				for (var cellNr = 0; cellNr < this.fNumCells; cellNr++) {
					if (cellBubbleParticleCount[cellNr] == 0)
						continue;

					var radius = Math.sqrt(cellBubbleRadius[cellNr]);
					var pid = cellBubbleParticleIds[cellNr];

					this.bubbleRadius[pid] = radius;
				}
			}


			updateParticleColors() {
				// for (var i = 0; i < this.numParticles; i++) {
				// 	this.particleColor[3 * i] *= 0.99; 
				// 	this.particleColor[3 * i + 1] *= 0.99
				// 	this.particleColor[3 * i + 2] = 
				// 		clamp(this.particleColor[3 * i + 2] + 0.001, 0.0, 1.0)
				// }

				// return;

				var h1 = this.fInvSpacing;

				for (var i = 0; i < this.numFluidParticles; i++) {
					var s = 0.01;

					this.particleColor[3 * i] = clamp(this.particleColor[3 * i] - s, 0.0, 1.0);
					this.particleColor[3 * i + 1] = clamp(this.particleColor[3 * i + 1] - s, 0.0, 1.0);
					this.particleColor[3 * i + 2] = clamp(this.particleColor[3 * i + 2] + s, 0.0, 1.0);

					var x = this.particlePos[2 * i];
					var y = this.particlePos[2 * i + 1];
					var xi = clamp(Math.floor(x * h1), 1, this.fNumX - 1);
					var yi = clamp(Math.floor(y * h1), 1, this.fNumY - 1);
					var cellNr = xi * this.fNumY + yi;

					var d0 = this.particleRestDensity;

					if (d0 > 0.0) {
						var relDensity = this.particleDensity[cellNr] / d0;
						if (relDensity < 0.3) {
							var s = 0.;
							this.particleColor[3 * i] = s;
							this.particleColor[3 * i + 1] = 0.6;
							this.particleColor[3 * i + 2] = 0.7;
						}
					}
				}
			}

			setSciColor(cellNr, val, minVal, maxVal) {
				val = Math.min(Math.max(val, minVal), maxVal - 0.0001);
				var d = maxVal - minVal;
				val = d == 0.0 ? 0.5 : (val - minVal) / d;
				var m = 0.25;
				var num = Math.floor(val / m);
				var s = (val - num * m) / m;
				var r, g, b;

				switch (num) {
					case 0: r = 0.0; g = s; b = 1.0; break;
					case 1: r = 0.0; g = 1.0; b = 1.0 - s; break;
					case 2: r = s; g = 1.0; b = 0.0; break;
					case 3: r = 1.0; g = 1.0 - s; b = 0.0; break;
				}

				this.cellColor[3 * cellNr] = r;
				this.cellColor[3 * cellNr + 1] = g;
				this.cellColor[3 * cellNr + 2] = b;
			}

			updateCellColors() {
				this.cellColor.fill(0.0);

				// Visualize acoustic pressure field
				for (var i = 0; i < this.fNumCells; i++) {
					if (scene.showAcousticPressure) {
						if (this.cellType[i] === AIR_CELL) {
							const p = this.acousticPressure[i];
							const normalizedPressure = (p - scene.acousticPressureMin) /
								(scene.acousticPressureMax - scene.acousticPressureMin);
							this.setSciColor(i, normalizedPressure, 0.0, 1.0);
						}
					}
					if (this.cellType[i] == SOLID_CELL) {
						this.cellColor[3 * i] = 0.5;
						this.cellColor[3 * i + 1] = 0.5;
						this.cellColor[3 * i + 2] = 0.5;
					}
					else if (this.cellType[i] == FLUID_CELL) {
						var d = this.particleDensity[i];
						if (this.particleRestDensity > 0.0)
							d /= this.particleRestDensity;
						this.setSciColor(i, d, 0.0, 2.0);
					}
				}

				const topNarrowBand = this.searchTopNarrowBand();
				for (var i = 0; i < this.fNumCells; i++) {
					if (topNarrowBand[i]) {
						this.cellColor[3 * i] = 1.0;
						this.cellColor[3 * i + 1] = 0.0;
						this.cellColor[3 * i + 2] = 0.0;
					}
				}
			}

			computeAcousticPressure() {
				// Create array to store pressure values for each cell
				this.acousticPressure.fill(0.0);

				// For each air cell
				for (let i = 0; i < this.fNumX; i++) {
					for (let j = 0; j < this.fNumY; j++) {
						const cellNr = i * this.fNumY + j;

						if (this.cellType[cellNr] !== AIR_CELL) {
							continue;
						}

						// Cell center position
						const x = (i + 0.5) * this.h;
						const y = (j + 0.5) * this.h;

						// Accumulate pressure contributions from all bubbles
						let pressure = 0.0;
						for (let k = this.numFluidParticles; k < this.numParticles; k++) {
							if (!isBubbleParticle(k)) continue;

							// Bubble position
							const xb = this.particlePos[2 * k];
							const yb = this.particlePos[2 * k + 1];

							// Distance to bubble
							const dx = x - xb;
							const dy = y - yb;
							const dist = Math.sqrt(dx * dx + dy * dy);

							if (dist < 1e-6) continue;

							// Compute bubble's acceleration (second derivative of sin wave)
							// a = -A * ω² * sin(ωt + φ)
							const freq = 3.0 / this.bubbleRadius[k];  // Same as in audio worklet
							const omega = freq * 2 * Math.PI;
							const acceleration = Math.sin(omega * this.bubbleTime[k] + this.bubblePhase[k]);

							// Add pressure contribution
							pressure += (acceleration / dist);
						}

						this.acousticPressure[cellNr] = pressure;
						console.log("acoustic pressure: ", pressure);
					}
				}

				// Update min/max for visualization
				let pMin = Number.MAX_VALUE;
				let pMax = -Number.MAX_VALUE;
				for (let i = 0; i < this.fNumCells; i++) {
					if (this.cellType[i] === AIR_CELL) {
						pMin = Math.min(pMin, this.acousticPressure[i]);
						pMax = Math.max(pMax, this.acousticPressure[i]);
					}
				}
				scene.acousticPressureMin = pMin;
				scene.acousticPressureMax = pMax;
			}

			simulate(dt, gravity, flipRatio, numPressureIters, numParticleIters, overRelaxation, compensateDrift, separateParticles, obstacleX, abstacleY, obstacleRadius) {
				var numSubSteps = 1;
				var sdt = dt / numSubSteps;

				for (var step = 0; step < numSubSteps; step++) {
					this.integrateParticles(sdt, gravity);
					if (separateParticles)
						this.pushParticlesApart(numParticleIters);
					this.handleParticleCollisions(obstacleX, abstacleY, obstacleRadius)
					this.transferVelocities(true);
					this.updateParticleDensity();
					this.solveIncompressibility(numPressureIters, sdt, overRelaxation, compensateDrift);
					this.transferVelocities(false, flipRatio);
				}

				// if (scene.addBubbleMode) {
				this.addBubbleParticles();
				this.mergeBubbleParticles();
				this.deleteBubbleParticles();
				this.decayBubbleParticles();
				// }

				// Add this line to compute acoustic pressure
				if (scene.showAcousticPressure) {
					this.computeAcousticPressure();
				}

				this.updateBubbleState(dt);

				this.updateParticleColors();
				this.updateCellColors();
			}

			updateBubbleState(dt) {
				for (let i = this.numFluidParticles; i < this.numParticles; i++) {
					if (!isBubbleParticle(i)) continue;
					this.bubbleTime[i] += dt;
				}
			}

			addSingleBubbleAtPosition(x, y, radius) {
				if (this.numParticles >= this.maxParticles) {
					console.log("maxParticles reached");
					return;
				}

				// Find an empty slot for the new bubble
				for (var j = this.numFluidParticles; j < this.maxParticles; j++) {
					if (this.particleType[j] == 0) { // found an empty slot
						this.particleType[j] = 2; // set as bubble particle
						// this.particleType[j] = 3; // For test: set as decaying bubble particle

						this.particlePos[2 * j] = x;
						this.particlePos[2 * j + 1] = y;

						this.particleVel[2 * j] = 0.0;
						this.particleVel[2 * j + 1] = 0.0;

						this.particleColor[3 * j] = 1.0;
						this.particleColor[3 * j + 1] = 1.0;

						this.bubbleTime[j] = 0.0;

						this.numParticles++;
						this.numBubbleParticles++;
						break;
					}
				}
			}
		}

		const pointVertexShader = `#version 300 es
		in vec2 attrPosition;
		in vec3 attrColor;
		uniform vec2 domainSize;
		uniform float pointSize;
		uniform float drawDisk;

		out vec3 fragColor;
		out float fragDrawDisk;

		void main() {
			vec4 screenTransform = 
				vec4(2.0 / domainSize.x, 2.0 / domainSize.y, -1.0, -1.0);
			gl_Position =
				vec4(attrPosition * screenTransform.xy + screenTransform.zw, 0.0, 1.0);

			gl_PointSize = pointSize;
			fragColor = attrColor;
			fragDrawDisk = drawDisk;
		}`;

		const bubbleVertexShader = `#version 300 es
		in vec2 attrPosition;
		uniform vec3 attrColor;
		uniform vec2 domainSize;
		uniform float pointSize;
		uniform float drawDisk;

		out vec3 fragColor;
		out float fragDrawDisk;

		void main() {
			vec4 screenTransform = 
				vec4(2.0 / domainSize.x, 2.0 / domainSize.y, -1.0, -1.0);
			gl_Position =
				vec4(attrPosition * screenTransform.xy + screenTransform.zw, 0.0, 1.0);

		const pointFragmentShader = `#version 300 es
		precision mediump float;
		in vec3 fragColor;
		in float fragDrawDisk;
		out vec4 outColor;

		void main() {
			if (fragDrawDisk == 1.0) {
				float rx = 0.5 - gl_PointCoord.x;
				float ry = 0.5 - gl_PointCoord.y;
				float r2 = rx * rx + ry * ry;
				if (r2 > 0.25)
					discard;
			}
			outColor = vec4(fragColor, 1.0);
		}`;

		const meshVertexShader = `#version 300 es
		in vec2 attrPosition;
		uniform vec2 domainSize;
		uniform vec3 color;
		uniform vec2 translation;
		uniform float scale;

		out vec3 fragColor;

		void main() {
			vec2 v = translation + attrPosition * scale;
			vec4 screenTransform = 
				vec4(2.0 / domainSize.x, 2.0 / domainSize.y, -1.0, -1.0);
			gl_Position =
				vec4(v * screenTransform.xy + screenTransform.zw, 0.0, 1.0);

			fragColor = color;
		}`;

		const meshFragmentShader = `#version 300 es
		precision mediump float;
		in vec3 fragColor;
		out vec4 outColor;

		void main() {
			outColor = vec4(fragColor, 1.0);
		}`;

		const marchingSquareVertexShader = `#version 300 es
		in vec2 position;
		uniform vec2 domainSize;
		out vec2 vUv;

		void main() {
			vUv = position;
			vec4 screenTransform = vec4(2.0 / domainSize.x, 2.0 / domainSize.y, -1.0, -1.0);
			gl_Position = vec4(position * screenTransform.xy + screenTransform.zw, 0.0, 1.0);
		}`;

		const marchingSquareFragmentShader = `#version 300 es
		precision mediump float;
		in vec2 vUv;
		out vec4 fragColor;
		uniform sampler2D densityField;
		uniform float isoLevel;
		uniform vec2 gridSize;

		// Edge table from your reference code
		const int edgeTable[16] = int[16](
			0, 9, 3, 10, 6, 15, 5, 12,
			12, 5, 15, 6, 10, 3, 9, 0
		);

		vec2 interpolateVerts(vec2 p1, vec2 p2, float v1, float v2) {
			float t = (isoLevel - v1) / (v2 - v1);
			return mix(p1, p2, t);
		}

		void main() {
			vec2 uv = vUv;
			vec2 cellSize = 1.0 / gridSize;
			vec2 cell = floor(uv * gridSize);
			
			// Sample density at cell corners
			float d00 = texture(densityField, (cell + vec2(0.0, 0.0)) * cellSize).r;
			float d10 = texture(densityField, (cell + vec2(1.0, 0.0)) * cellSize).r;
			float d11 = texture(densityField, (cell + vec2(1.0, 1.0)) * cellSize).r;
			float d01 = texture(densityField, (cell + vec2(0.0, 1.0)) * cellSize).r;
			
			// Calculate cell configuration
			int config = 0;
			if(d00 > isoLevel) config |= 1;
			if(d10 > isoLevel) config |= 2;
			if(d11 > isoLevel) config |= 4;
			if(d01 > isoLevel) config |= 8;
			
			// Get edge intersections
			vec2 p0 = cell * cellSize;
			vec2 p1 = (cell + vec2(1.0, 0.0)) * cellSize;
			vec2 p2 = (cell + vec2(1.0, 1.0)) * cellSize;
			vec2 p3 = (cell + vec2(0.0, 1.0)) * cellSize;
			
			// Draw edges based on configuration
			float lineWidth = 0.002;
			vec3 lineColor = vec3(0.2, 0.6, 1.0);
			vec3 fillColor = vec3(0.0);
			
			// Calculate distance to edges based on configuration
			float d = 1000.0;
			
			int edges = edgeTable[config];
			if((edges & 1) != 0) {
				vec2 v = interpolateVerts(p0, p1, d00, d10);
				d = min(d, length(uv - v));
			}
			if((edges & 2) != 0) {
				vec2 v = interpolateVerts(p1, p2, d10, d11);
				d = min(d, length(uv - v));
			}
			if((edges & 4) != 0) {
				vec2 v = interpolateVerts(p2, p3, d11, d01);
				d = min(d, length(uv - v));
			}
			if((edges & 8) != 0) {
				vec2 v = interpolateVerts(p3, p0, d01, d00);
				d = min(d, length(uv - v));
			}
			
			// Output final color
			if(d < lineWidth) {
				fragColor = vec4(lineColor, 1.0);
			} else {
				fragColor = vec4(fillColor, 0.0);
			}
		}`;

		function createShader(gl, vsSource, fsSource) {
			const vsShader = gl.createShader(gl.VERTEX_SHADER);
			gl.shaderSource(vsShader, vsSource);
			gl.compileShader(vsShader);
			if (!gl.getShaderParameter(vsShader, gl.COMPILE_STATUS)) {
				console.error("vertex shader compile error: " + gl.getShaderInfoLog(vsShader));
				return null;
			}

			const fsShader = gl.createShader(gl.FRAGMENT_SHADER);
			gl.shaderSource(fsShader, fsSource);
			gl.compileShader(fsShader);
			if (!gl.getShaderParameter(fsShader, gl.COMPILE_STATUS)) {
				console.error("fragment shader compile error: " + gl.getShaderInfoLog(fsShader));
				return null;
			}

			var shader = gl.createProgram();
			gl.attachShader(shader, vsShader);
			gl.attachShader(shader, fsShader);
			gl.linkProgram(shader);

			if (!gl.getProgramParameter(shader, gl.LINK_STATUS)) {
				console.error("shader program link error: " + gl.getProgramInfoLog(shader));
				return null;
			}

			// Clean up shader objects
			gl.deleteShader(vsShader);
			gl.deleteShader(fsShader);

			return shader;
		}

		var pointShader = null;
		var meshShader = null;
		var bubbleShader = null;

		var pointVertexBuffer = null;

		var diskVertBuffer = null;

		// Create circle vertices
		function createCircleVertices(centerX, centerY, radius, segments) {
			// const vertices = [centerX, centerY];
			const vertices = [];
			for (let i = 0; i <= segments; i++) {
				const angle = i * 2 * Math.PI / segments;
				const x = centerX + radius * Math.cos(angle);
				const y = centerY + radius * Math.sin(angle);
				vertices.push(x, y);
			}
			return new Float32Array(vertices);
		}

		function draw() {
			gl.clearColor(0.0, 0.0, 0.0, 1.0);
			gl.clear(gl.COLOR_BUFFER_BIT);

			gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);

			// prepare shaders
			if (pointShader == null) {
				pointShader = createShader(gl, pointVertexShader, pointFragmentShader);
				if (!pointShader) {
					console.error("Failed to create point shader");
					return;
				}
			}
			if (meshShader == null) {
				meshShader = createShader(gl, meshVertexShader, meshFragmentShader);
				if (!meshShader) {
					console.error("Failed to create mesh shader");
					return;
				}
			}
			if (bubbleShader == null) {
				bubbleShader = createShader(gl, bubbleVertexShader, pointFragmentShader);
				if (!bubbleShader) {
					console.error("Failed to create bubble shader");
					return;
				}
			}

			// grid

			if (gridVertBuffer == null) {

				var f = scene.fluid;
				gridVertBuffer = gl.createBuffer();
				var cellCenters = new Float32Array(2 * f.fNumCells);
				var p = 0;

				for (var i = 0; i < f.fNumX; i++) {
					for (var j = 0; j < f.fNumY; j++) {
						cellCenters[p++] = (i + 0.5) * f.h;
						cellCenters[p++] = (j + 0.5) * f.h;
					}
				}
				gl.bindBuffer(gl.ARRAY_BUFFER, gridVertBuffer);
				gl.bufferData(gl.ARRAY_BUFFER, cellCenters, gl.DYNAMIC_DRAW);
				gl.bindBuffer(gl.ARRAY_BUFFER, null);
			}

			if (gridColorBuffer == null)
				gridColorBuffer = gl.createBuffer();

			if (scene.showGrid) {

				var pointSize = 0.9 * scene.fluid.h / simWidth * canvas.width;

				gl.useProgram(pointShader);
				gl.uniform2f(gl.getUniformLocation(pointShader, 'domainSize'), simWidth, simHeight);
				gl.uniform1f(gl.getUniformLocation(pointShader, 'pointSize'), pointSize);
				gl.uniform1f(gl.getUniformLocation(pointShader, 'drawDisk'), 0.0);

				gl.bindBuffer(gl.ARRAY_BUFFER, gridVertBuffer);
				var posLoc = gl.getAttribLocation(pointShader, 'attrPosition');
				gl.enableVertexAttribArray(posLoc);
				gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

				gl.bindBuffer(gl.ARRAY_BUFFER, gridColorBuffer);
				gl.bufferData(gl.ARRAY_BUFFER, scene.fluid.cellColor, gl.DYNAMIC_DRAW);

				var colorLoc = gl.getAttribLocation(pointShader, 'attrColor');
				gl.enableVertexAttribArray(colorLoc);
				gl.vertexAttribPointer(colorLoc, 3, gl.FLOAT, false, 0, 0);

				gl.drawArrays(gl.POINTS, 0, scene.fluid.fNumCells);

				gl.disableVertexAttribArray(posLoc);
				gl.disableVertexAttribArray(colorLoc);

				gl.bindBuffer(gl.ARRAY_BUFFER, null);
			}

			// water

			if (scene.showParticles) {
				gl.clear(gl.DEPTH_BUFFER_BIT);

				var pointSize = 2.0 * scene.fluid.particleRadius / simWidth * canvas.width;

				gl.useProgram(pointShader);
				gl.uniform2f(gl.getUniformLocation(pointShader, 'domainSize'), simWidth, simHeight);
				gl.uniform1f(gl.getUniformLocation(pointShader, 'pointSize'), pointSize);
				gl.uniform1f(gl.getUniformLocation(pointShader, 'drawDisk'), 1.0);

				if (pointVertexBuffer == null)
					pointVertexBuffer = gl.createBuffer();
				if (pointColorBuffer == null)
					pointColorBuffer = gl.createBuffer();

				gl.bindBuffer(gl.ARRAY_BUFFER, pointVertexBuffer);
				gl.bufferData(gl.ARRAY_BUFFER, scene.fluid.particlePos, gl.DYNAMIC_DRAW);

				var posLoc = gl.getAttribLocation(pointShader, 'attrPosition');
				gl.enableVertexAttribArray(posLoc);
				gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

				gl.bindBuffer(gl.ARRAY_BUFFER, pointColorBuffer);
				gl.bufferData(gl.ARRAY_BUFFER, scene.fluid.particleColor, gl.DYNAMIC_DRAW);

				var colorLoc = gl.getAttribLocation(pointShader, 'attrColor');
				gl.enableVertexAttribArray(colorLoc);
				gl.vertexAttribPointer(colorLoc, 3, gl.FLOAT, false, 0, 0);

				// gl.drawArrays(gl.POINTS, 0, scene.fluid.numParticles); 
				gl.drawArrays(gl.POINTS, 0, scene.fluid.numFluidParticles);

				gl.disableVertexAttribArray(posLoc);
				gl.disableVertexAttribArray(colorLoc);

				gl.bindBuffer(gl.ARRAY_BUFFER, null);
			}

			// at each bubble particle, draw a circle with its radius 
			// draw circles for bubble particles

			// Create bubble circles vert buffer 
			// traverse the particle array use makeCircle function for each bubble particle to create vertices
			const bubbleCirclesBuffers = [];
			for (var i = scene.fluid.numFluidParticles; i < scene.fluid.numParticles; i++) {
				if (isBubbleParticle(i)) { // bubble particle
					var numSegs = 30;
					const vertices = createCircleVertices(scene.fluid.particlePos[2 * i], scene.fluid.particlePos[2 * i + 1], scene.fluid.bubbleRadius[i], numSegs);
					const buffer = gl.createBuffer();
					gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
					gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.DYNAMIC_DRAW);

					bubbleCirclesBuffers.push({
						buffer: buffer,
						vertexCount: vertices.length / 2,
						color: [1.0, 1.0, 1.0]
					});
				}
			}

			gl.useProgram(bubbleShader);
			gl.uniform2f(gl.getUniformLocation(bubbleShader, 'domainSize'), simWidth, simHeight);
			gl.uniform1f(gl.getUniformLocation(bubbleShader, 'pointSize'), pointSize);
			gl.uniform1f(gl.getUniformLocation(bubbleShader, 'drawDisk'), 1.0);
			var posLoc = gl.getAttribLocation(bubbleShader, 'attrPosition');
			var colorLoc = gl.getUniformLocation(bubbleShader, 'attrColor');

			bubbleCirclesBuffers.forEach(({ buffer, vertexCount, color }) => {

				gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
				gl.enableVertexAttribArray(posLoc);
				gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

				gl.uniform3fv(colorLoc, color);
				gl.enableVertexAttribArray(colorLoc);
				// gl.drawArrays(gl.TRIANGLE_FAN, 0, vertexCount);
				gl.drawArrays(gl.LINE_LOOP, 0, vertexCount);
			});


			// disk

			// prepare disk mesh

			var numSegs = 50;

			if (diskVertBuffer == null) {

				diskVertBuffer = gl.createBuffer();
				var dphi = 2.0 * Math.PI / numSegs;
				var diskVerts = new Float32Array(2 * numSegs + 2);
				var p = 0;
				diskVerts[p++] = 0.0;
				diskVerts[p++] = 0.0;
				for (var i = 0; i < numSegs; i++) {
					diskVerts[p++] = Math.cos(i * dphi);
					diskVerts[p++] = Math.sin(i * dphi);
				}
				gl.bindBuffer(gl.ARRAY_BUFFER, diskVertBuffer);
				gl.bufferData(gl.ARRAY_BUFFER, diskVerts, gl.DYNAMIC_DRAW);
				gl.bindBuffer(gl.ARRAY_BUFFER, null);

				diskIdBuffer = gl.createBuffer();
				var diskIds = new Uint16Array(3 * numSegs);
				p = 0;
				for (var i = 0; i < numSegs; i++) {
					diskIds[p++] = 0;
					diskIds[p++] = 1 + i;
					diskIds[p++] = 1 + (i + 1) % numSegs;
				}

				gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, diskIdBuffer);
				gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, diskIds, gl.DYNAMIC_DRAW);
				gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null);
			}

			gl.clear(gl.DEPTH_BUFFER_BIT);

			var diskColor = [1.0, 0.0, 0.0];

			gl.useProgram(meshShader);
			gl.uniform2f(gl.getUniformLocation(meshShader, 'domainSize'), simWidth, simHeight);
			gl.uniform3f(gl.getUniformLocation(meshShader, 'color'), diskColor[0], diskColor[1], diskColor[2]);
			gl.uniform2f(gl.getUniformLocation(meshShader, 'translation'), scene.obstacleX, scene.obstacleY);
			gl.uniform1f(gl.getUniformLocation(meshShader, 'scale'), scene.obstacleRadius + scene.fluid.particleRadius);

			posLoc = gl.getAttribLocation(meshShader, 'attrPosition');
			gl.enableVertexAttribArray(posLoc);
			gl.bindBuffer(gl.ARRAY_BUFFER, diskVertBuffer);
			gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

			gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, diskIdBuffer);
			gl.drawElements(gl.TRIANGLES, 3 * numSegs, gl.UNSIGNED_SHORT, 0);

			gl.disableVertexAttribArray(posLoc);

			if (scene.showMarchingSquares && scene.marchingSquares) {
				// Update density field texture
				const densityField = new Float32Array(scene.marchingSquareGridSize * scene.marchingSquareGridSize);

				// Calculate density field from particles
				for (let i = 0; i < scene.fluid.numFluidParticles; i++) {
					const x = scene.fluid.particlePos[2 * i];
					const y = scene.fluid.particlePos[2 * i + 1];

					// Convert to grid coordinates
					const gx = Math.floor(x * scene.marchingSquareGridSize / simWidth);
					const gy = Math.floor(y * scene.marchingSquareGridSize / simHeight);

					if (gx >= 0 && gx < scene.marchingSquareGridSize &&
						gy >= 0 && gy < scene.marchingSquareGridSize) {
						densityField[gy * scene.marchingSquareGridSize + gx] += 0.1;
					}
				}

				// Update texture
				gl.bindTexture(gl.TEXTURE_2D, scene.marchingSquares.densityTexture);
				gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, scene.marchingSquareGridSize,
					scene.marchingSquareGridSize, 0, gl.RED, gl.FLOAT, densityField);

				// Render marching squares
				gl.useProgram(scene.marchingSquares.shader);
				gl.uniform2f(gl.getUniformLocation(scene.marchingSquares.shader, 'domainSize'),
					simWidth, simHeight);
				gl.uniform1f(gl.getUniformLocation(scene.marchingSquares.shader, 'isoLevel'),
					scene.isoLevel);
				gl.uniform2f(gl.getUniformLocation(scene.marchingSquares.shader, 'gridSize'),
					scene.marchingSquareGridSize, scene.marchingSquareGridSize);

				gl.activeTexture(gl.TEXTURE0);
				gl.bindTexture(gl.TEXTURE_2D, scene.marchingSquares.densityTexture);
				gl.uniform1i(gl.getUniformLocation(scene.marchingSquares.shader, 'densityField'), 0);

				gl.bindBuffer(gl.ARRAY_BUFFER, scene.marchingSquares.quadBuffer);
				const posLoc = gl.getAttribLocation(scene.marchingSquares.shader, 'position');
				gl.enableVertexAttribArray(posLoc);
				gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

				gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
			}
		}

		function setObstacle(x, y, reset) {

			var vx = 0.0;
			var vy = 0.0;

			if (!reset) {
				vx = (x - scene.obstacleX) / scene.dt;
				vy = (y - scene.obstacleY) / scene.dt;
			}

			scene.obstacleX = x;
			scene.obstacleY = y;
			var r = scene.obstacleRadius;
			var f = scene.fluid;
			var n = f.numY;
			var cd = Math.sqrt(2) * f.h;

			for (var i = 1; i < f.numX - 2; i++) {
				for (var j = 1; j < f.numY - 2; j++) {

					f.s[i * n + j] = 1.0;

					dx = (i + 0.5) * f.h - x;
					dy = (j + 0.5) * f.h - y;

					if (dx * dx + dy * dy < r * r) {
						f.s[i * n + j] = 0.0;
						f.u[i * n + j] = vx;
						f.u[(i + 1) * n + j] = vx;
						f.v[i * n + j] = vy;
						f.v[i * n + j + 1] = vy;
					}
				}
			}

			scene.showObstacle = true;
			scene.obstacleVelX = vx;
			scene.obstacleVelY = vy;
		}

		// interaction -------------------------------------------------------

		var mouseDown = false;

		function startDrag(x, y) {
			let bounds = canvas.getBoundingClientRect();

			let mx = x - bounds.left - canvas.clientLeft;
			let my = y - bounds.top - canvas.clientTop;
			mouseDown = true;

			x = mx / cScale;
			y = (canvas.height - my) / cScale;

			if (scene.addBubbleMode) {
				var bubbleSizeSlider = document.getElementById('bubbleSize');
				var radius = (bubbleSizeSlider.value / 20.0) * scene.fluid.h;  // Scale from 0.05h to h
				scene.fluid.addSingleBubbleAtPosition(x, y, radius);
				mouseDown = false; // Don't start dragging after adding bubble
				return;
			}

			setObstacle(x, y, true);
			scene.paused = false;
		}

		function drag(x, y) {
			if (mouseDown) {
				let bounds = canvas.getBoundingClientRect();
				let mx = x - bounds.left - canvas.clientLeft;
				let my = y - bounds.top - canvas.clientTop;
				x = mx / cScale;
				y = (canvas.height - my) / cScale;
				setObstacle(x, y, false);
			}
		}

		function endDrag() {
			mouseDown = false;
			scene.obstacleVelX = 0.0;
			scene.obstacleVelY = 0.0;
		}

		canvas.addEventListener('mousedown', event => {
			startDrag(event.x, event.y);
		});

		canvas.addEventListener('mouseup', event => {
			endDrag();
		});

		canvas.addEventListener('mousemove', event => {
			drag(event.x, event.y);
		});

		canvas.addEventListener('touchstart', event => {
			startDrag(event.touches[0].clientX, event.touches[0].clientY)
		});

		canvas.addEventListener('touchend', event => {
			endDrag()
		});

		canvas.addEventListener('touchmove', event => {
			event.preventDefault();
			event.stopImmediatePropagation();
			drag(event.touches[0].clientX, event.touches[0].clientY)
		}, { passive: false });


		document.addEventListener('keydown', event => {
			switch (event.key) {
				case 'p': scene.paused = !scene.paused; break;
				case 'm': scene.paused = false; simulate(); scene.paused = true; break;
			}
		});

		function toggleStart() {
			var button = document.getElementById('startButton');
			if (scene.paused)
				button.innerHTML = "Stop";
			else
				button.innerHTML = "Start";
			scene.paused = !scene.paused;
		}

		// main -------------------------------------------------------

		function simulate() {
			if (!scene.paused)
				scene.fluid.simulate(
					scene.dt, scene.gravity, scene.flipRatio, scene.numPressureIters, scene.numParticleIters,
					scene.overRelaxation, scene.compensateDrift, scene.separateParticles,
					scene.obstacleX, scene.obstacleY, scene.obstacleRadius, scene.colorFieldNr);
			scene.frameNr++;
		}

		function update() {
			simulate();
			draw();
			requestAnimationFrame(update);
		}

		setupScene();
		update();

	</script>
</body>

</html>
